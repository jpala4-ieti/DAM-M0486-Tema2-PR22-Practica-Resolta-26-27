# Classe del controlador JDBC per la base de dades SQLite
hibernate.connection.driver_class=org.sqlite.JDBC

# URL de connexió a la base de dades SQLite al directori data
hibernate.connection.url=jdbc:sqlite:./data/database.db

# Dialecte per mantenir la compatibilitat amb SQLite
hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Mostra les consultes SQL a la consola (true/false)
hibernate.show_sql=false

# Estratègia de generació automàtica de l'esquema
# Opcions:
# validate: Valida l'esquema sense fer canvis
# update: Actualitza l'esquema si és necessari
# create: Crea l'esquema, destruint les dades anteriors
# create-drop: Crea l'esquema a l'inici i l'esborra al tancar
# none: Desactiva la generació automàtica
hibernate.hbm2ddl.auto=create

# Hibernate 7 reordena les columnes per mida en crear les taules. Amb SQLite, si una
# columna 'integer' queda abans de la clau primària, la clau es crea sense tipus,
# deixa de ser autoincremental i es desa a NULL (find i les consultes no troben res).
# Amb 'legacy' es manté l'ordre de declaració i la clau primària queda la primera.
hibernate.column_ordering_strategy=legacy
